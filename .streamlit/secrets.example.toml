# Copy this file to `.streamlit/secrets.toml` for local development.
# In Streamlit Community Cloud, add the same keys in App settings > Secrets.

OPENAI_API_KEY = "sk-..."

# Optional: enables GitHub MCP tools.
GITHUB_ACCESS_TOKEN = "github_pat_..."

# Optional: enables the email escalation tool.
EMAIL_USER = "destination@example.com"
EMAIL_SENDER = "sender@gmail.com"
EMAIL_PASSWORD = "gmail-app-password"

# Optional agent tuning.
ATLAS_MODEL = "gpt-5-nano-2025-08-07"
ATLAS_TEMPERATURE = "0.2"
